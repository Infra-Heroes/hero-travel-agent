# Urlaubs-Agent. The start page is public; the planner needs an account (e-mail address
# and a one-time code, app/auth.py).
[app]
name = "urlaubs-agent"

[deploy]
cpu = 1
memory_mb = 512
port = 8080
health_path = "/healthz"
# One replica, no scale-to-zero: users, trips and counters live on a volume.

# Create it once:
#   heroctl volumes create urlaubs-data --size 1 --project urlaubs-agent
[[volumes]]
name = "urlaubs-data"
mount = "/data"

[env]
LOG_LEVEL = "info"
DATA_DIR = "/data"
# DeepSeek V4 Flash on OpenRouter: cheap, long context, JSON-schema output.
AGENT_MODEL = "deepseek/deepseek-v4-flash"
AGENT_EFFORT = "medium"
# Requests per person and day, and for the whole agent: every request costs money.
USER_DAILY_QUERIES = "10"
AGENT_DAILY_CALLS = "200"
# Optional: narrow who can sign up, comma separated. Empty means every address.
ALLOWED_EMAILS = ""
ALLOWED_EMAIL_DOMAINS = ""
MAIL_FROM = "Urlaubs-Agent <info@infra-heroes.de>"
SMTP_PORT = "587"

# Secrets, set once per project (the values are never in this file):
#   OPENROUTER_API_KEY  the model; without an sk-or-... key the agent answers with samples
#   SMTP_HOST, SMTP_USER, SMTP_PASSWORD   the mail server that sends the sign-in codes;
#                       without SMTP_HOST nobody can sign in
#   METRICS_TOKEN       bearer token Prometheus uses for /metrics (and /api/stats)
#   SESSION_SECRET      signs the session cookies, 16+ random characters
OPENROUTER_API_KEY = "secret:OPENROUTER_API_KEY"
SMTP_HOST = "secret:SMTP_HOST"
SMTP_USER = "secret:SMTP_USER"
SMTP_PASSWORD = "secret:SMTP_PASSWORD"
METRICS_TOKEN = "secret:METRICS_TOKEN"
SESSION_SECRET = "secret:SESSION_SECRET"
# Daily report to the operator (numbers only). The address is a secret: REPORT_TO.
REPORT_TO = "secret:REPORT_TO"
REPORT_HOUR_UTC = "6"
