[project]
name = "hero-travel-agent"
version = "0.1.0"
description = "Urlaubs-Agent: personal travel planner (suggestions + day plans, no booking)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "prometheus-client>=0.20",
    "pydantic>=2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "bandit>=1.7",
    "pip-audit>=2.7",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.setuptools.package-data]
app = ["static/*", "static/vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=app --cov-report=term-missing:skip-covered --cov-fail-under=90"

[tool.coverage.run]
branch = true

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
# pycodestyle, pyflakes, imports, bugbear, pyupgrade, bandit, simplify, comprehensions,
# timezone-aware dates, ruff's own, pytest style, async, logging, returns.
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "C4", "DTZ", "RUF", "PT", "ASYNC", "LOG", "PIE", "RET"]
# Line length is the formatter's job.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Tests assert, use made-up passwords and build SQL from fixed table names.
"tests/**" = ["S101", "S105", "S106", "S608", "PT018", "E731"]

[tool.mypy]
python_version = "3.12"
packages = ["app"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
